<!doctype html>
<html lang="en" data-theme="nashira" data-mode="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="theme-color" content="#161719" />
		<title>Nashira</title>
		<script>
			// Restore the colour mode before hydration so the page never flashes, and
			// point theme-color at the matching shell background. Keep these two hex
			// values in sync with --app-bg in app.css.
			(function () {
				var BG = { light: '#eaecf6', dark: '#161719' };
				var mode = 'dark';
				try {
					var raw = localStorage.getItem('nashira:prefs');
					var p = raw ? JSON.parse(raw) : {};
					mode = p.mode === 'light' ? 'light' : 'dark';
				} catch (e) {
					/* localStorage unavailable — keep the default */
				}
				document.documentElement.setAttribute('data-mode', mode);
				var meta = document.querySelector('meta[name="theme-color"]');
				if (meta) meta.setAttribute('content', BG[mode]);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
