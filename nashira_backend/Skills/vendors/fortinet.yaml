platform: fortinet
description: Fortinet FortiOS. `get` for state and `show` for configuration; a narrower catalogue than the routing platforms because FortiOS is firewall-shaped.
commands:
  - intent: show_version
    command: get system status
    description: Firmware version, model, serial, HA mode and uptime.
  - intent: show_running_config
    command: show full-configuration
    description: Complete active configuration including defaults.
  - intent: show_interfaces
    command: get system interface
    description: Interface addresses, status, allowed access and zone membership.
  - intent: show_arp
    command: get system arp
    description: ARP table — IP to MAC bindings with interface.
  - intent: show_route_table
    command: get router info routing-table all
    description: Routing table with protocol, metric and next hop.
  - intent: show_cpu
    command: get system performance status
    description: CPU and memory utilisation, session counts and uptime.
